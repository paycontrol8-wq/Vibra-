<!DOCTYPE html>
<html lang="es">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}

  font-family: "Optimistic Mono", ui-monospace, monospace;

<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vibra</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
body{margin:0;font-family:system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:12px}
.card{background:white;border-radius:20px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.icon{width:80px;height:80px;border-radius:20px;background:#f4f4f5;overflow:hidden;flex-shrink:0}
.icon img{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:16px}
.screens{display:flex;gap:10px;overflow:auto;padding:12px 0}
.screens img{height:240px;border-radius:16px;border:1px solid #eee;flex-shrink:0}
.btn{width:100%;background:#2563eb;color:white;border:0;padding:18px;border-radius:16px;font-weight:800;font-size:17px;cursor:pointer}
.badge{background:#f4f4f5;padding:5px 12px;border-radius:20px;font-size:11px}
.longBox{background:#f9f9fb;padding:16px;border-radius:14px;font-size:13px;white-space:pre-wrap;line-height:1.6}
.hint{background:#111;color:white;padding:12px;border-radius:12px;font-size:12px;margin-top:12px}
.ok{background:#dcfce7;color:#166534;padding:12px;border-radius:12px;font-size:12px;margin-top:12px;font-weight:600}
#appContent{width:100%;height:100vh;border:0}
</style>
</head>
<body>
<div id="loading" style="padding:40px;text-align:center;color:#666">Cargando...</div>
<div id="store" class="wrap" style="display:none"></div>
<div id="vibraApp" style="display:none;width:100%;height:100vh"></div>

<script>
var cfg={apiKey:"AIzaSyA3f6NfbDGpr8JsSybpn5XdmzGCmJPQTqY",authDomain:"apk-simple.firebaseapp.com",projectId:"apk-simple",storageBucket:"apk-simple.firebasestorage.app",messagingSenderId:"184380088864",appId:"1:184380088864:web:3f0e17ee08fe0cdbb61245"};
firebase.initializeApp(cfg);
var db=firebase.firestore();
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }

var deferredPrompt=null, installed=false;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; });
window.addEventListener('appinstalled', ()=>{ installed=true; });


var params=new URLSearchParams(location.search);
var id=params.get('id');
var mode=params.get('mode');

// Guardar último ID
if(id){ try{ localStorage.setItem('lastVibraId', id); }catch(e){} }
if(!id){ try{ id=localStorage.getItem('lastVibraId'); }catch(e){} }

function showStoreWithId(appId){
  db.collection('apps').doc(appId).get().then(doc=>{
    if(!doc.exists){ document.getElementById('loading').innerHTML='App no encontrada'; return; }
    var a=doc.data();
    document.getElementById('loading').style.display='none';
    document.getElementById('store').style.display='block';
    var container=document.getElementById('store');
    var icon = a.iconBase64 ? `<img src="${a.iconBase64}">` : '';
    var shortDesc = esc(a.shortDesc||'');
    var longDesc = a.longDesc||'';
    var caps = a.screenshots||[];
    container.innerHTML=`
      <div class="card">
        <div class="row"><div class="icon">${icon}</div>
        <div style="flex:1"><h2 style="margin:0;font-size:22px;font-weight:800">${esc(a.name)}</h2>
        <div style="font-size:12px;color:#666">By ${esc(a.creatorName||'Orlando Claro')}</div>
        <div style="margin-top:8px;display:flex;gap:6px"><span class="badge">${esc(a.version||'v1.2')}</span><span class="badge">${esc(a.packageName||'com.vibra.app')}</span></div></div></div>
        <p style="font-size:13px;margin-top:14px">${shortDesc}</p>
        <button class="btn" id="installBtn">↓ Instalar</button>
        <div id="hint" style="display:none"></div>
        <h3 style="font-size:13px;font-weight:700;margin-top:22px">Screenshots</h3>
        <div class="screens" id="scr"></div>
        <div style="margin-top:18px"><div style="font-size:12px;font-weight:700">Descripción</div><div class="longBox">${esc(longDesc)}</div></div>
      </div>
    `;
    var scrDiv=document.getElementById('scr');
    caps.forEach(src=>{ var img=document.createElement('img'); img.src=src; scrDiv.appendChild(img); });
    var manifest={
      name: a.name || 'Vibra',
      short_name: (a.name||'Vibra').substring(0,12),
      description: a.shortDesc || '',
      start_url: location.origin + location.pathname + '?id=' + appId + '&mode=app',
      display: 'standalone',
      background_color: '#ffffff',
      theme_color: '#7c3aed',
      icons: a.iconBase64 ? [{src: a.iconBase64, sizes: '192x192', type: 'image/png'},{src: a.iconBase64, sizes: '512x512', type: 'image/png'}] : []
    };
    var blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var link=document.createElement('link'); link.rel='manifest'; link.href=url; document.head.appendChild(link);
    document.title = a.name + ' - Instalar';
    var btn=document.getElementById('installBtn');
    var hint=document.getElementById('hint');
    btn.onclick=function(){
      if(deferredPrompt){
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(choice=>{
          if(choice.outcome==='accepted'){ hint.innerHTML='<div class="ok">✅ ¡Vibra instalada! Ya está en tu pantalla de inicio.</div>'; } else { hint.innerHTML='<div class="hint">Instalación cancelada</div>'; }
          hint.style.display='block'; deferredPrompt=null;
        });
      } else {
        hint.innerHTML='<div class="hint">Para instalar Vibra:<br>Chrome → ⋮ → <b>Instalar app</b></div>'; hint.style.display='block';
      }
    };
  });
}

function showAppOnly(appId){
  db.collection('apps').doc(appId).get().then(doc=>{
    if(!doc.exists){ document.getElementById('loading').innerHTML='App no encontrada ID '+appId; return; }
    var a=doc.data();
    document.getElementById('loading').style.display='none';
    var appDiv=document.getElementById('vibraApp');
    appDiv.style.display='block';
    document.title = a.name || 'Vibra';
    if(a.contentType==='url' && a.content){
      var ifr=document.createElement('iframe'); ifr.src=a.content; ifr.style.width='100%'; ifr.style.height='100vh'; ifr.style.border='0'; appDiv.appendChild(ifr); return;
    }
    if(a.content && a.content.length>50){
      var ifr=document.createElement('iframe'); ifr.style.width='100%'; ifr.style.height='100vh'; ifr.style.border='0'; appDiv.appendChild(ifr);
      try{ ifr.srcdoc = a.content; } catch(e){ var blob=new Blob([a.content],{type:'text/html'}); ifr.src=URL.createObjectURL(blob); }
      return;
    }
    // Si no hay content, mostrar la app como tienda pero en modo standalone para no quedar blanco
    appDiv.innerHTML='<div style="padding:20px;text-align:center"><h2>'+esc(a.name)+'</h2><p>Abriendo Vibra...</p></div>';
    // fallback: si no hay HTML, mostrar screenshots + desc para no quedar blanco
    document.getElementById('vibraApp').style.display='none';
    document.getElementById('store').style.display='block';
    showStoreWithId(appId);
  }).catch(e=>{ document.getElementById('loading').innerHTML='Error: '+e.message; });
}

if(!id){
  // Si no hay ID en ningún lado, cargar la última app publicada (evita pantalla blanca)
  db.collection('apps').orderBy('createdAt','desc').limit(1).get().then(snap=>{
    if(snap.empty){ document.getElementById('loading').innerHTML='No hay apps publicadas'; return; }
    var d=snap.docs[0];
    id=d.id;
    try{ localStorage.setItem('lastVibraId', id); }catch(e){}
    if(mode==='app'){ showAppOnly(id); } else { showStoreWithId(id); }
  });
} else if(mode==='app'){
  showAppOnly(id);
} else {
  showStoreWithId(id);
}

</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
